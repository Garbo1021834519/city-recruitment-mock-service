services:
  app:
    build: .
    image: city-recruitment-mock-service:latest
    container_name: city-recruitment-app
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      REA_HOST: 0.0.0.0
      REA_PORT: 4222
      REA_DATABASE_PATH: /data/app.sqlite
    ports:
      - "4222:4222"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4222/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
